name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      # versionCode is the workflow run number, so every push produces a newer build and
      # `adb install -r` upgrades in place instead of erroring. versionName keeps the
      # major.minor from the build file and takes the run number as its patch.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in RELEASE_KEYSTORE_BASE64 SIGNING_LINEAGE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ ! ${!secret} =~ [^[:space:]] ]]; then
              echo "::error::Missing required release signing secret: $secret"
              exit 1
            fi
          done

          signing_dir=$(mktemp -d "$RUNNER_TEMP/brightimport-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          umask 077
          export KEYSTORE_FILE="$signing_dir/release.jks" SIGNING_LINEAGE_FILE="$signing_dir/release.lineage"
          decode() {
            if ! printf '%s' "${!1}" | base64 --decode > "$2" || [[ ! -s "$2" ]]; then
              echo "::error::$1 must contain non-empty base64"
              exit 1
            fi
          }
          decode RELEASE_KEYSTORE_BASE64 "$KEYSTORE_FILE"
          decode SIGNING_LINEAGE_BASE64 "$SIGNING_LINEAGE_FILE"
          unset RELEASE_KEYSTORE_BASE64 SIGNING_LINEAGE_BASE64

          mkdir -p out
          bash scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/BrightImport-v$VERSION.apk" signing-lineage-root-fingerprint.txt signing-fingerprint.txt

      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      # Joining the camera access point is the app. Without CHANGE_NETWORK_STATE the
      # WifiNetworkSpecifier request is refused at runtime, and the failure looks like a
      # camera that will not pair rather than like a missing permission.
      - name: Verify network permissions
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions out/*.apk > perms.txt
          cat perms.txt
          for p in \
            android.permission.INTERNET \
            android.permission.CHANGE_NETWORK_STATE \
            android.permission.ACCESS_NETWORK_STATE; do
            grep -q "$p" perms.txt || { echo "::error::$p missing"; exit 1; }
          done

      # This app deliberately does not ask for location. Fuji's own client does, it is the
      # single loudest complaint about it, and a stray dependency could reintroduce it
      # without anyone noticing.
      - name: Verify no location permission crept in
        run: |
          if grep -q "ACCESS_.*_LOCATION" perms.txt; then
            echo '::error::a location permission was added — see the manifest comment'
            exit 1
          fi
          echo "no location permission, as intended"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightImport-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BrightImport v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: out/*.apk
